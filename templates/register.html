<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - IT招聘数据可视化分析</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sweetalert2.min.css') }}">
    <style>
        *{box-sizing:border-box}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;margin:0;padding:0}
        .login-wrapper{min-height:100vh;display:flex;align-items:center;justify-content:center;background:url('https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=serene%20mountain%20lake%20landscape%20with%20snow-capped%20mountains%2C%20calm%20water%20reflection%2C%20clear%20blue%20sky%2C%20sun%20rising%2C%20professional%20landscape%20photography&image_size=landscape_16_9') no-repeat center center fixed;background-size:cover;position:relative}
        .login-wrapper::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:0}
        .login-card{width:420px;padding:40px;border-radius:20px;background:#fff;box-shadow:0 8px 32px rgba(0,0,0,0.1);position:relative;z-index:1}
        .login-card h3{font-weight:700;color:#222;margin-bottom:6px}
        .login-card .sub{color:#6a6a6a;font-size:14px;margin-bottom:28px}
        .login-card .form-control{border-radius:10px;padding:10px 14px;border:1px solid #c1c1c1}
        .login-card .btn-primary{width:100%;padding:10px;border-radius:10px;font-weight:600;background:#2563eb;border:none}
        .login-card .btn-primary:hover{background:#1d4ed8}
        .login-card .form-label{font-weight:500;color:#222;font-size:14px}
        .login-icon{text-align:center;margin-bottom:20px}
        .login-icon i{font-size:48px;color:#2563eb}
        .flash-container{position:fixed;top:16px;right:16px;z-index:9999;min-width:300px}
        .alert{border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
    </style>
</head>
<body>
    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-container">
        {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-icon"><i class="bi bi-person-plus-fill"></i></div>
            <h3 class="text-center">创建新账号</h3>
            <p class="sub text-center">注册一个账号以使用系统</p>
            <form method="post">
                <div class="mb-3">
                    <label class="form-label">用户名</label>
                    <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">密码</label>
                    <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">确认密码</label>
                    <input type="password" name="password2" class="form-control" placeholder="请再次输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary mt-2">注 册</button>
            </form>
            <p class="text-center mt-3" style="font-size:14px;color:#6a6a6a">已有账号？<a href="{{ url_for('login') }}">返回登录</a></p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sweetalert2.all.min.js') }}"></script>
    <script>
        setTimeout(()=>{document.querySelectorAll('.flash-container .alert').forEach(el=>{el.classList.remove('show');setTimeout(()=>el.remove(),300)})},3000);
    </script>
</body>
</html>
